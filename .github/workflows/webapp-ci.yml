name: webapp CI

on:
  # No path filter: build-index.mjs (run below) reads README.md and every
  # top-level vendor folder, not just webapp/**, so a content-only PR (a
  # new prompt file, a filename tweak, a broken README table) can break the
  # indexer or the generated offline assets just as easily as a change
  # under webapp/ itself. The job is a ~30s build, cheap enough to run on
  # every push/PR rather than trying to keep a path filter in sync with
  # "everything build-index.mjs touches."
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - run: npm ci

      # Regenerates public/generated/** from ../<Vendor>/** + ../README.md.
      # Also run by `npm run build`'s prebuild hook below, but broken out
      # here so the file/vendor-count summary and any stale-README warnings
      # show up as their own step in the log.
      - name: Build content index
        run: npm run build:index

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      # TODO(roadmap item 1): once webapp/e2e/ exists (a committed
      # Playwright smoke test), add a step here to install its browser and
      # run it against `npm run preview`, before the dist/ upload below.

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-dist
          path: webapp/dist
          retention-days: 7
